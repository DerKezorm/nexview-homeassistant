approve_request:
  fields:
    request_id:
      required: true
      example: 42
      selector:
        number:
          min: 1
          mode: box
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: nexview

reject_request:
  fields:
    request_id:
      required: true
      example: 42
      selector:
        number:
          min: 1
          mode: box
    reason:
      required: false
      example: Already in the library
      selector:
        text:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: nexview

defer_request:
  fields:
    request_id:
      required: true
      example: 42
      selector:
        number:
          min: 1
          mode: box
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: nexview

cancel_request:
  fields:
    request_id:
      required: true
      example: 42
      selector:
        number:
          min: 1
          mode: box
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: nexview

search:
  fields:
    query:
      required: true
      example: Dune
      selector:
        text:
    media_type:
      required: false
      default: movie
      selector:
        select:
          options:
            - movie
            - tv
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: nexview

list_requests:
  fields:
    status:
      required: false
      example: pending_approval
      selector:
        text:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: nexview

active_downloads:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: nexview

get_quota:
  fields:
    account_id:
      required: false
      example: 3
      selector:
        number:
          min: 1
          mode: box
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: nexview

now_playing:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: nexview
